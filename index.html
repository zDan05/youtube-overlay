<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}.bar{position:absolute;bottom:35px;left:35px;display:flex;align-items:center;gap:15px;background:rgba(18,18,22,.94);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:14px 19px;color:white;box-shadow:0 12px 35px #0007;animation:cycle 15s infinite both}.logo{background:#ff0033;border-radius:12px;width:60px;height:44px;display:grid;place-items:center}.play{width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:17px solid white;margin-left:5px}.name{font-size:27px;font-weight:800;letter-spacing:.2px}.sub{background:#ff0033;border-radius:8px;padding:12px 16px;font-size:17px;font-weight:800;letter-spacing:.4px}@keyframes cycle{0%{opacity:0;transform:translateX(-130%)}7%{opacity:1;transform:translateX(0)}62%{opacity:1;transform:translateX(0)}66.666%{opacity:0;transform:translateX(80px)}100%{opacity:0;transform:translateX(80px)}}</style></head><body><div class="bar"><div class="logo"><div class="play"></div></div><div class="name">@zdan05</div><div class="sub">SUBSCRIBE</div></div></body></html>
